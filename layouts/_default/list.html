<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ .Title }} · {{ .Site.Title }}</title>

<style>
  :root{
    --bg:#ffffff;
    --text:#0f172a;
    --muted:rgba(15,23,42,.70);
    --border:rgba(15,23,42,.10);
    --shadow:0 18px 60px rgba(2,6,23,.10);
    --shadow-soft:0 10px 30px rgba(2,6,23,.08);
    --card:#ffffff;
    --card-muted:rgba(15,23,42,.62);
    --topbar:rgba(255,255,255,.70);
    --topbar-border:rgba(15,23,42,.06);
    --accent:#3b82f6;
  }
  body.dark{
    --bg:#0f172a;
    --text:#e2e8f0;
    --muted:rgba(226,232,240,.70);
    --border:rgba(255,255,255,.10);
    --card:#1e293b;
    --card-muted:rgba(226,232,240,.65);
    --topbar:rgba(15,23,42,.70);
    --topbar-border:rgba(255,255,255,.10);
    --shadow:0 18px 60px rgba(0,0,0,.40);
    --shadow-soft:0 10px 30px rgba(0,0,0,.30);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text);transition:background-color .2s ease,color .2s ease}
  .lead a{color:#3b82f6}
  body.dark .lead a{color:#60a5fa}
  .container{max-width:1120px;margin:0 auto;padding:0 22px}

  .topbar{position:sticky;top:0;backdrop-filter:saturate(160%) blur(10px);background:var(--topbar);border-bottom:1px solid var(--topbar-border);z-index:20}
  .topbar-inner{display:flex;align-items:center;gap:18px;padding:14px 0}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.2px;text-decoration:none;color:inherit}
  .brand svg{width:22px;height:22px}
  .spacer{flex:1}
  .iconrow{display:flex;align-items:center;gap:10px}
  .iconbtn{width:36px;height:36px;border-radius:14px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;box-shadow:0 8px 22px rgba(2,6,23,.06);text-decoration:none;color:inherit;padding:0;font:inherit;cursor:pointer}
  .iconbtn:hover{border-color:rgba(59,130,246,.35)}
  .iconbtn svg{width:18px;height:18px}
  .theme-toggle .icon-sun{display:none}
  body.dark .theme-toggle .icon-sun{display:block}
  body.dark .theme-toggle .icon-moon{display:none}

  main{padding:34px 0 70px}
  h1{margin:0 0 12px;font-size:40px;letter-spacing:-.6px;font-weight:900;background:linear-gradient(90deg,#60a5fa 0%,#a78bfa 45%,#7dd3fc 100%);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
  .lead{color:var(--muted);line-height:1.75;max-width:70ch}

  .backlink{
    display:inline-flex;align-items:center;gap:8px;
    text-decoration:none;
    color:var(--muted);
    font-weight:800;
    min-height:44px;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    box-shadow:var(--shadow-soft);
    margin-bottom:16px;
  }
  .backlink:hover{border-color:rgba(59,130,246,.35)}

  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}
  .card{display:block;text-decoration:none;color:inherit;border:1px solid var(--border);background:var(--card);border-radius:22px;padding:18px;box-shadow:0 12px 30px rgba(2,6,23,.06);transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
  .card:hover{transform:translateY(-2px) scale(1.01);border-color:rgba(59,130,246,.35);box-shadow:inset 4px 0 0 var(--accent),0 18px 46px rgba(2,6,23,.10)}
  .card h3{margin:0 0 8px;font-size:16px;font-weight:900}
  .card p{margin:0;color:var(--card-muted);font-size:13.5px;line-height:1.35}

  @media (max-width:760px){.cards{grid-template-columns:1fr}h1{font-size:34px}}
  iframe{max-width:100%;display:block}
  .pdf-link{
    display:none;
    margin:12px 0;
    padding:10px 18px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    box-shadow:0 4px 14px rgba(2,6,23,.08);
    text-decoration:none;
    color:var(--text);
    font-weight:700;
    font-size:15px;
  }
  .pdf-link:hover{border-color:rgba(59,130,246,.35)}
  @media (max-width:760px){
    .pdf-embed{display:none}
    .pdf-link{display:inline-flex;align-items:center;gap:8px}
  }

  .site-footer{border-top:1px solid var(--border);padding:28px 0 34px;text-align:center;color:var(--muted);font-size:14px}
  .site-footer .iconrow{justify-content:center;margin-bottom:12px}
  .site-footer p{margin:4px 0}
  .site-footer .tagline{font-weight:700}
</style>
</head>

<body>
  <script>
    // Apply the saved theme before the page paints to avoid a flash of light mode.
    (function(){
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch(e) {}
      if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark');
      }
    })();
  </script>

  <header class="topbar">
    <div class="container">
      <div class="topbar-inner">
        <a class="brand" href="{{ .Site.Home.RelPermalink }}">
          <!-- Knowledge base icon (replaced play icon) -->
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 6c-2.6-1.4-5.2-1.6-8-.7v12.5c2.8-1 5.4-.8 8 .7"
                  stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 6c2.6-1.4 5.2-1.6 8-.7v12.5c-2.8-1-5.4-.8-8 .7"
                  stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="15" cy="15" r="2"
                    stroke="currentColor" stroke-width="1.7"/>
            <path d="M16.5 16.5l2 2"
                  stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span>{{ .Site.Title }}</span>
        </a>

        <div class="spacer"></div>

        <button class="iconbtn theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>

        <div class="iconrow">
          <a class="iconbtn" href="https://www.linkedin.com/in/markphilp/" target="_blank" rel="noopener noreferrer" title="LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M20.45 20.45H17v-5.4c0-1.29-.02-2.95-1.8-2.95-1.8 0-2.08 1.4-2.08 2.85v5.5H9.67V9h3.3v1.56h.05c.46-.87 1.6-1.8 3.3-1.8 3.53 0 4.18 2.32 4.18 5.34v6.35ZM5.34 7.43A1.92 1.92 0 1 1 5.34 3.6a1.92 1.92 0 0 1 0 3.83ZM3.62 20.45h3.44V9H3.62v11.45Z"/>
            </svg>
          </a>

          <a class="iconbtn" href="https://github.com/vrbabapancake" target="_blank" rel="noopener noreferrer" title="GitHub">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.77.6-3.35-1.17-3.35-1.17-.45-1.15-1.11-1.46-1.11-1.46-.9-.62.07-.61.07-.61 1 .07 1.53 1.04 1.53 1.04.9 1.54 2.35 1.1 2.92.84.09-.66.35-1.1.64-1.36-2.21-.25-4.54-1.11-4.54-4.95 0-1.1.39-2 1.03-2.71-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.03A9.6 9.6 0 0 1 12 6.84c.85 0 1.71.12 2.51.35 1.9-1.3 2.74-1.03 2.74-1.03.56 1.38.21 2.4.1 2.65.64.71 1.03 1.61 1.03 2.71 0 3.85-2.34 4.7-4.57 4.95.36.31.69.92.69 1.86v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <a class="backlink" href="{{ .Site.Home.RelPermalink }}">← Home</a>

      <h1>{{ .Title }}</h1>

      {{ if .Content }}
        <div class="lead">{{ .Content }}</div>
      {{ end }}

      {{ if .Pages }}
        <div class="cards">
          {{ range .Pages }}
            <a class="card" href="{{ .RelPermalink }}">
              <h3>{{ .Title }}</h3>
              <p>{{ .Summary | plainify | truncate 140 }}</p>
            </a>
          {{ end }}
        </div>
      {{ end }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="iconrow">
        <a class="iconbtn" href="https://www.linkedin.com/in/markphilp/" target="_blank" rel="noopener noreferrer" title="LinkedIn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.45 20.45H17v-5.4c0-1.29-.02-2.95-1.8-2.95-1.8 0-2.08 1.4-2.08 2.85v5.5H9.67V9h3.3v1.56h.05c.46-.87 1.6-1.8 3.3-1.8 3.53 0 4.18 2.32 4.18 5.34v6.35ZM5.34 7.43A1.92 1.92 0 1 1 5.34 3.6a1.92 1.92 0 0 1 0 3.83ZM3.62 20.45h3.44V9H3.62v11.45Z"/>
          </svg>
        </a>
        <a class="iconbtn" href="https://github.com/vrbabapancake" target="_blank" rel="noopener noreferrer" title="GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.77.6-3.35-1.17-3.35-1.17-.45-1.15-1.11-1.46-1.11-1.46-.9-.62.07-.61.07-.61 1 .07 1.53 1.04 1.53 1.04.9 1.54 2.35 1.1 2.92.84.09-.66.35-1.1.64-1.36-2.21-.25-4.54-1.11-4.54-4.95 0-1.1.39-2 1.03-2.71-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.03A9.6 9.6 0 0 1 12 6.84c.85 0 1.71.12 2.51.35 1.9-1.3 2.74-1.03 2.74-1.03.56 1.38.21 2.4.1 2.65.64.71 1.03 1.61 1.03 2.71 0 3.85-2.34 4.7-4.57 4.95.36.31.69.92.69 1.86v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/>
          </svg>
        </a>
      </div>
      <p class="tagline">Technical Writer &amp; Content Designer</p>
      <p>&copy; {{ now.Year }} Mark Philp</p>
    </div>
  </footer>

  <script>
    (function(){
      var btn = document.querySelector('.theme-toggle');
      if (!btn) return;
      function sync(){ btn.setAttribute('aria-pressed', document.body.classList.contains('dark') ? 'true' : 'false'); }
      sync();
      btn.addEventListener('click', function(){
        var isDark = document.body.classList.toggle('dark');
        try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch(e) {}
        sync();
      });
    })();
  </script>
</body>
</html>
